name: Test
on:
  # Runs only when started by hand (Actions tab > Run workflow), to save CI minutes.
  workflow_dispatch:
jobs:
  patch-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q
