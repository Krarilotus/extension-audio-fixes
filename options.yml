meta:
  version: 1.0.0
options:
  - name: startup_sfx_volume
    category: ['{{bugfixes}}']
    header: '{{startup_text}}'
    text: '{{startup_description}}'
    display: UCP2Switch
    url: audio-fixes.startup-sfx-volume
    contents:
      value: true
  - name: video_fx_volume
    category: ['{{bugfixes}}']
    header: '{{video_text}}'
    text: '{{video_description}}'
    display: UCP2Switch
    url: audio-fixes.video-fx-volume
    contents:
      value: true
  - name: positional_audio
    category: ['{{bugfixes}}']
    header: '{{positional_text}}'
    text: '{{positional_description}}'
    display: UCP2Switch
    url: audio-fixes.positional-audio
    contents:
      value: true
