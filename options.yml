meta:
  version: 1.0.0
options:
  - name: startup_sfx_volume
    category: ['{{audio_fixes}}']
    text: '{{startup_text}}'
    description: '{{startup_description}}'
    display: Switch
    url: audio-fixes.startup-sfx-volume
    contents:
      value: false
  - name: video_fx_volume
    category: ['{{audio_fixes}}']
    text: '{{video_text}}'
    description: '{{video_description}}'
    display: Switch
    url: audio-fixes.video-fx-volume
    contents:
      value: false
  - name: positional_audio
    category: ['{{audio_fixes}}']
    text: '{{positional_text}}'
    description: '{{positional_description}}'
    display: Switch
    url: audio-fixes.positional-audio
    contents:
      value: false
